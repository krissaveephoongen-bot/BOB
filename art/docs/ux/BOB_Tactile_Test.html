<style>
/* Layout: chip picker for the 16 minigames, one 2:1 play area like the S28 card, a meter row, then a note on how the selected test is built. */
:root{
  --bg:#F4F6FB; --panel:#FFFFFF; --fg:#0B1A3A; --muted:#55607A; --line:#D7DDEA; --accent:#1A6FC4; --chip:#E8EEF8; --chipOn:#0B1A3A; --chipOnFg:#FFFFFF;
  --card:#FEEECF; --frame:#2E4484; --cardFg:#0B1A3A;
  --display:"Mitr","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0B1222;--panel:#121B30;--fg:#E8EDF8;--muted:#9AA6C2;--line:#26324D;--accent:#6CB2FF;--chip:#1B2742;--chipOn:#E8EDF8;--chipOnFg:#0B1222;--card:#2A2416;--frame:#6C86D6;--cardFg:#F6EEDC;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1222;--panel:#121B30;--fg:#E8EDF8;--muted:#9AA6C2;--line:#26324D;--accent:#6CB2FF;--chip:#1B2742;--chipOn:#E8EDF8;--chipOnFg:#0B1222;--card:#2A2416;--frame:#6C86D6;--cardFg:#F6EEDC;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 56px;display:grid;gap:18px}
h1,h2{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}
h1{font-size:clamp(24px,4vw,34px)} h2{font-size:20px}
p{margin:0;max-width:72ch} .lead{color:var(--muted);margin-top:6px}
.picker{display:grid;gap:8px}
.group{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.group b{font-family:var(--display);font-weight:500;font-size:14px;color:var(--muted);margin-right:4px;min-width:60px}
.chip{font-family:var(--body);font-size:14px;border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:999px;padding:3px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--chipOn);color:var(--chipOnFg);border-color:var(--chipOn)}
.chip:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stage{background:var(--card);border:5px solid var(--frame);border-radius:26px;padding:10px;display:grid;gap:10px;min-width:0}
.top{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;color:var(--cardFg);font-family:var(--display)}
.top .id{font-size:14px;opacity:.7} .top .name{font-size:20px;font-weight:600}
canvas{width:100%;aspect-ratio:2/1;max-width:100%;display:block;border-radius:16px;touch-action:none;cursor:grab;background:#E8EEF3}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-family:var(--display);font-size:16px;color:var(--cardFg)}
.meter{flex:1 1 180px;height:20px;border-radius:10px;background:#E3E7F0;border:3px solid #041E4F;overflow:hidden;min-width:0}
.meter i{display:block;height:100%;width:0;background:#178A4F;transition:width .15s}
#status{font-variant-numeric:tabular-nums;min-width:9ch}
button.reset{font-family:var(--display);font-size:15px;border:3px solid #041E4F;background:#F6C431;color:#041E4F;border-radius:999px;padding:3px 16px;cursor:pointer}
.how{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:6px;font-size:14.5px;color:var(--muted)}
.how b{color:var(--fg);font-weight:500}
.err{color:#D81E36}
</style>

<div class="wrap">
  <header>
    <h1>BOB · ทดสอบผิวสัมผัสของวัตถุ</h1>
    <p class="lead">ลองผิวสัมผัสของมินิเกมทั้ง 16 ตัว ความสมจริงทั้งหมดมาจาก shader และโค้ด ไม่มีภาพวาด รูปทรงยังเป็นการ์ตูน เส้นขอบน้ำตาล แสงเงา 3 ขั้นตาม concept ใช้นิ้วหรือเมาส์ได้ เวลาและจำนวนในหน้านี้สั้นกว่าในเกมเพื่อให้ลองได้เร็ว</p>
  </header>
  <nav class="picker" aria-label="เลือกมินิเกม">
    <div class="group" id="g-mvp"><b>MVP</b></div>

  </section>
  <section class="how" id="how"></section>
  <p id="msg" class="lead"></p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
if(!window.THREE){document.getElementById('msg').innerHTML='<span class="err">โหลด three.js ไม่ได้ ลองเปิดหน้าใหม่อีกครั้ง</span>';return;}
const V3=THREE.Vector3, clamp=THREE.MathUtils.clamp, lerp=THREE.MathUtils.lerp;
const OUT=0x4A2E22; // outline brown, 00_Art_Direction
const rnd=(a,b)=>a+Math.random()*(b-a);
const cv=document.getElementById('cv');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true});R.setPixelRatio(Math.min(2,devicePixelRatio||1));
function resize(){const w=cv.clientWidth,h=cv.clientHeight;if(w&&h)R.setSize(w,h,false);}new ResizeObserver(resize).observe(cv);resize();

/* ---------- shared look ---------- */
const RAMP=(()=>{const d=new Uint8Array([90,80,120,255, 170,165,190,255, 255,255,255,255]);const t=new THREE.DataTexture(d,3,1,THREE.RGBAFormat);t.minFilter=t.magFilter=THREE.NearestFilter;t.needsUpdate=true;return t;})();
const matCache={};
const toon=(c,o={})=>{const k=c+JSON.stringify(o);if(!o.unique&&matCache[k])return matCache[k];const m=new THREE.MeshToonMaterial(Object.assign({color:c,gradientMap:RAMP},o.p||{}));if(!o.unique)matCache[k]=m;return m;};
const outlineMat=new THREE.MeshBasicMaterial({color:OUT,side:THREE.BackSide});
function ol(mesh,t=.05){const m=new THREE.Mesh(mesh.geometry,outlineMat);m.scale.setScalar(1+t);mesh.add(m);return mesh;}
function M(geo,c,t,o){const m=new THREE.Mesh(geo,typeof c==='object'?c:toon(c,o));if(t!==0)ol(m,t==null?.05:t);return m;}
function cnv(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d',{willReadFrequently:true});fn&&fn(g,w,h);return c;}
function rounded(w,h,d,seg,rad){const g=new THREE.BoxGeometry(w,h,d,seg,seg,seg);const p=g.attributes.position,v=new V3();const hw=w/2-rad,hh=h/2-rad,hd=d/2-rad;
  for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);const c=new V3(clamp(v.x,-hw,hw),clamp(v.y,-hh,hh),clamp(v.z,-hd,hd));const dl=v.clone().sub(c);if(dl.length()>0)dl.setLength(rad);v.copy(c.add(dl));p.setXYZ(i,v.x,v.y,v.z);}g.computeVertexNormals();return g;}
function eyes(parent,y,z,s=1,frown=false,x0=0){const g=new THREE.Group();[-1,1].forEach(sd=>{const w=M(new THREE.SphereGeometry(.13*s,16,12),0xffffff,.08);w.position.set(x0+sd*.17*s,y,z);w.scale.z=.5;g.add(w);const p=M(new THREE.SphereGeometry(.065*s,12,8),0x1B1030,0);p.position.set(x0+sd*.16*s,y-.01*s,z+.06*s);g.add(p);
  if(frown){const b=M(new THREE.BoxGeometry(.2*s,.04*s,.04*s),0x1B1030,0);b.position.set(x0+sd*.17*s,y+.17*s,z+.03);b.rotation.z=sd*-.45;g.add(b);}});parent.add(g);return g;}

/* paint layer on a canvas, sampled by surface shader */
class Layer{constructor(w,h){this.c=cnv(w,h);this.g=this.c.getContext('2d',{willReadFrequently:true});this.t=new THREE.CanvasTexture(this.c);this.w=w;this.h=h;this.p=cnv(64,32);this.pg=this.p.getContext('2d');this.base=1;}
  clear(){this.g.globalCompositeOperation='source-over';this.g.clearRect(0,0,this.w,this.h);this.t.needsUpdate=true;}
  blob(x,y,r,col,a){const g=this.g;g.globalCompositeOperation='source-over';const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`rgba(${col},${a})`);gr.addColorStop(1,`rgba(${col},0)`);g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();this.t.needsUpdate=true;}
  erase(uv,r,k,spread=.8){const g=this.g;g.globalCompositeOperation='destination-out';const x=uv.x*this.w,y=(1-uv.y)*this.h;for(let i=0;i<4;i++){const ox=rnd(-r*spread,r*spread),oy=rnd(-r*spread*.6,r*spread*.6);const gr=g.createRadialGradient(x+ox,y+oy,0,x+ox,y+oy,r*.6);gr.addColorStop(0,`rgba(0,0,0,${k})`);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.beginPath();g.arc(x+ox,y+oy,r*.6,0,7);g.fill();}this.t.needsUpdate=true;}
  paintUV(uv,r,col,a){this.blob(uv.x*this.w,(1-uv.y)*this.h,r,col,a);}
  dry(k){const g=this.g;g.globalCompositeOperation='destination-out';g.fillStyle=`rgba(0,0,0,${k})`;g.fillRect(0,0,this.w,this.h);this.t.needsUpdate=true;}
  sum(){this.pg.clearRect(0,0,64,32);this.pg.drawImage(this.c,0,0,64,32);const d=this.pg.getImageData(0,0,64,32).data;let s=0;for(let i=3;i<d.length;i+=4)s+=d[i];return s;}
  mark(){this.base=Math.max(1,this.sum());}
  left(){return clamp(this.sum()/this.base,0,1);}
}
/* surface: base texture + dirt layer (colour by alpha) + wet/foam layer */
function surface(baseTex,dirt,wet,o={}){
  return new THREE.ShaderMaterial({transparent:!!o.transparent,
    uniforms:{uBase:{value:baseTex},uDirt:{value:dirt?dirt.t:null},uWet:{value:wet?wet.t:null},uHasW:{value:wet?1:0},uL:{value:new V3(-.4,.8,.45).normalize()},uCam:{value:new V3(0,8,6)},uSheen:{value:o.sheen??.35},uFoam:{value:o.foam??1},uDirtA:{value:o.dirtA??1.1},uT:{value:0}},
    vertexShader:`varying vec2 vUv;varying vec3 vW;varying vec3 vN;void main(){vUv=uv;vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;vN=normalize(mat3(modelMatrix)*normal);gl_Position=projectionMatrix*viewMatrix*w;}`,
    fragmentShader:`uniform sampler2D uBase,uDirt,uWet;uniform float uHasW,uSheen,uFoam,uDirtA,uT;uniform vec3 uL,uCam;varying vec2 vUv;varying vec3 vW;varying vec3 vN;
      float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
      float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
      void main(){vec4 b=texture2D(uBase,vUv);vec3 col=b.rgb;float al=b.a;
        vec4 d=texture2D(uDirt,vUv);float a=clamp(d.a*uDirtA,0.,1.);col=mix(col,d.rgb*.92,a);al=max(al,a);
        vec3 V=normalize(uCam-vW);vec3 N0=normalize(vN);
        vec3 N=normalize(N0+vec3((n(vUv*60.)-.5)*.35,0.,(n(vUv*60.+7.)-.5)*.35));
        float sp=pow(max(dot(reflect(-uL,N),V),0.),24.);col+=step(.5,sp)*smoothstep(.45,.75,a)*vec3(1.,.93,.75)*uSheen;
        if(uHasW>.5){vec4 w=texture2D(uWet,vUv);float wa=w.a;col*=1.-wa*.22;
          vec3 Nw=normalize(N0+vec3((n(vUv*22.+uT*.05)-.5)*.6,0.,(n(vUv*22.+3.)-.5)*.6));float s2=pow(max(dot(reflect(-uL,Nw),V),0.),40.);
          col+=step(.5,s2)*smoothstep(.2,.5,wa)*vec3(.9,.97,1.)*.5;
          float cells=n(vUv*vec2(180.,90.))*.7+n(vUv*vec2(420.,210.))*.3;float fm=smoothstep(.3,.48,w.r*wa*(.3+cells))*uFoam;
          col=mix(col,vec3(.97,.99,1.),fm*.92);al=max(al,fm);}
        gl_FragColor=vec4(col,al);}`});}

/* particles */
class Parts{constructor(scene){this.s=scene;this.a=[];this.geo=new THREE.SphereGeometry(1,10,8);}
  add(pos,vel,o={}){if(this.a.length>140)return;const m=new THREE.Mesh(this.geo,toon(o.c??0xffffff,o.op!=null?{p:{transparent:true,opacity:o.op}}:{}));m.position.copy(pos);const s=o.s??.08;m.scale.setScalar(s);
    m.userData={v:vel.clone(),life:o.life??1,max:o.life??1,g:o.g??-6,s,stretch:o.stretch,onEnd:o.onEnd,floorY:o.floorY};this.s.add(m);this.a.push(m);}
  update(dt){for(let i=this.a.length-1;i>=0;i--){const m=this.a[i],u=m.userData;u.life-=dt;u.v.y+=u.g*dt;m.position.addScaledVector(u.v,dt);
      const k=u.life/u.max;m.scale.setScalar(u.s*(k<.3?k/.3:1));if(u.stretch)m.scale.y=u.s*(1+Math.min(1.5,Math.abs(u.v.y)*.15));
      if(u.floorY!=null&&m.position.y<u.floorY){u.onEnd&&u.onEnd(m.position);u.life=0;}
      if(u.life<=0){this.s.remove(m);this.a.splice(i,1);}}}
  clear(){this.a.forEach(m=>this.s.remove(m));this.a=[];}}
class Spring{constructor(k=180,d=12,x=0){this.k=k;this.d=d;this.x=x;this.v=0;this.t=x;}step(dt){const f=-this.k*(this.x-this.t)-this.d*this.v;this.v+=f*dt;this.x+=this.v*dt;return this.x;}kick(v){this.v+=v;}}

function stage(bg,cam,look,fov=30){const scene=new THREE.Scene();scene.background=new THREE.Color(bg);scene.add(new THREE.HemisphereLight(0xffffff,0x8a90b0,.55));const sun=new THREE.DirectionalLight(0xffffff,.75);sun.position.set(-3,8,5);scene.add(sun);
  const camera=new THREE.PerspectiveCamera(fov,2,.1,100);camera.position.set(...cam);camera.lookAt(...look);return {scene,camera,parts:new Parts(scene)};}
const woodTex=()=>new THREE.CanvasTexture(cnv(512,256,(g,w,h)=>{g.fillStyle='#D9B27C';g.fillRect(0,0,w,h);for(let i=0;i<7;i++){g.fillStyle='#B98E57';g.fillRect(0,i*h/7,w,3);}for(let i=0;i<220;i++){g.strokeStyle='rgba(150,100,50,.16)';g.beginPath();const y=Math.random()*h;g.moveTo(0,y);g.bezierCurveTo(w*.3,y+rnd(-6,6),w*.6,y+rnd(-6,6),w,y+rnd(-4,4));g.stroke();}}));
const tileTex=(a='#F4E6C3',b='#EAD9B0',n=12,m=6)=>new THREE.CanvasTexture(cnv(512,256,(g,w,h)=>{for(let j=0;j<m;j++)for(let i=0;i<n;i++){g.fillStyle=(i+j)%2?b:a;g.fillRect(i*w/n,j*h/m,w/n+1,h/m+1);}g.strokeStyle='rgba(120,90,50,.25)';for(let i=0;i<=n;i++){g.beginPath();g.moveTo(i*w/n,0);g.lineTo(i*w/n,h);g.stroke();}for(let j=0;j<=m;j++){g.beginPath();g.moveTo(0,j*h/m);g.lineTo(w,j*h/m);g.stroke();}}));
function grime(L,cx,cy,sx,sy,n,col='110,63,27',a=.55,rmin=18,rmax=46){for(let i=0;i<n;i++){const an=Math.random()*6.28,d=Math.pow(Math.random(),.7);L.blob(cx+Math.cos(an)*d*sx,cy+Math.sin(an)*d*sy,rnd(rmin,rmax),col,a);}for(let i=0;i<n*6;i++){L.g.fillStyle=`rgba(70,40,15,${rnd(.1,.35)})`;L.g.fillRect(cx+rnd(-sx,sx),cy+rnd(-sy,sy),rnd(1,3),rnd(1,3));}L.t.needsUpdate=true;}
function makeSponge(){const pores=new THREE.CanvasTexture(cnv(256,256,(g,w,h)=>{g.fillStyle='#FFE066';g.fillRect(0,0,w,h);for(let i=0;i<900;i++){g.fillStyle=`rgba(190,140,20,${rnd(.25,.6)})`;g.beginPath();g.ellipse(Math.random()*w,Math.random()*h,rnd(1,5),rnd(1,4),Math.random()*3,0,7);g.fill();}}));
  const root=new THREE.Group(),body=new THREE.Group();root.add(body);const mat=toon(0xffffff,{unique:true,p:{map:pores}});
  const top=M(rounded(1.9,.62,1.2,10,.22),mat);top.position.y=.62;body.add(top);const s=M(rounded(1.9,.26,1.2,10,.1),0x2E9E5B,.06);s.position.y=.17;body.add(s);
  return {root,body,mat,press:0,yaw:0};}
function driveSponge(sp,pos,vel,down,dt){const speed=vel.length();sp.press+=((down?1:0)-sp.press)*Math.min(1,dt*14);const st=Math.min(.35,speed*.035);
  sp.body.scale.set(1+st*.9+sp.press*.12,1-sp.press*.32-st*.15,1-st*.35+sp.press*.08);
  if(speed>.3){let y=Math.atan2(-vel.z,vel.x);if(y>Math.PI/2)y-=Math.PI;if(y<-Math.PI/2)y+=Math.PI;let d=y-sp.root.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));sp.root.rotation.y+=d*Math.min(1,dt*6);}
  sp.body.rotation.z=lerp(sp.body.rotation.z,-clamp(vel.x*.02,-.25,.25),Math.min(1,dt*8));sp.body.rotation.x=lerp(sp.body.rotation.x,clamp(vel.z*.02,-.25,.25),Math.min(1,dt*8));
  sp.root.position.set(pos.x,pos.y+(1-sp.press)*.55,pos.z);return speed;}
function shadowDisc(scene,r=1){const m=new THREE.Mesh(new THREE.CircleGeometry(r,32),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.18,depthWrite:false}));m.rotation.x=-Math.PI/2;scene.add(m);return m;}
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function onPlane(cam,y){ray.setFromCamera(ndc,cam);const p=new V3();return ray.ray.intersectPlane(new THREE.Plane(new V3(0,1,0),-y),p)?p:null;}
function onPlaneZ(cam,z){ray.setFromCamera(ndc,cam);const p=new V3();return ray.ray.intersectPlane(new THREE.Plane(new V3(0,0,1),-z),p)?p:null;}
function hitObj(cam,obj){ray.setFromCamera(ndc,cam);return ray.intersectObject(obj,true)[0];}

/* ================= BENCHES ================= */
const B={};

/* T01 sweep */
B.T01={name:'กวาดตามทาง',hint:'ลากไม้กวาดตามทางฝุ่น',how:'<b>ฝุ่น</b> เป็น paint mask ที่ถูกลบตามหัวไม้กวาด <b>ขนไม้กวาด</b> โค้งไปทางตรงข้ามกับทิศที่ลาก และยุบเมื่อกด <b>ฝุ่นฟุ้ง</b> เป็นอนุภาคปลิวไปตามทิศที่กวาด',
make(){const S=stage(0xEAD9B0,[0,9.2,6.4],[0,0,.2]);const dirt=new Layer(512,256);const mat=surface(tileTex(),dirt,null,{sheen:0});
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(12,6.6),mat);floor.rotation.x=-Math.PI/2;S.scene.add(floor);
  const broom=new THREE.Group(),head=new THREE.Group();broom.add(head);
  const handle=M(new THREE.CylinderGeometry(.07,.07,3,12),0xB7793A);handle.position.set(.9,1.5,0);handle.rotation.z=-.55;broom.add(handle);
  const cap=M(new THREE.BoxGeometry(1.6,.28,.4),0xF79A2E);cap.position.y=.45;head.add(cap);
  const bristle=new THREE.Group();head.add(bristle);for(let i=0;i<9;i++){const b=M(new THREE.BoxGeometry(.13,.5,.3),0xE8C26A,.08);b.position.set(-.7+i*.175,.06,0);b.geometry.translate(0,-.15,0);bristle.add(b);}
  S.scene.add(broom);const sh=shadowDisc(S.scene,.9);
  let pos=new V3(-4,0,1.6),tgt=pos.clone(),vel=new V3(),down=false,acc=0,press=0;
  function reset(){dirt.clear();const g=dirt.g;g.lineCap='round';
    const path=[[40,190],[160,200],[220,90],[330,70],[420,150],[480,120]];

B.T03={name:'ฉีดให้ตรงจุด',hint:'แตะสไลม์เพื่อฉีด',how:'<b>ละออง</b> พุ่งจากขวดเป็นกรวยไปยังจุดที่แตะ และทิ้ง<b>หยดน้ำบนผนัง</b> ที่ค่อยๆ แห้ง <b>สไลม์</b> เด้งดึ๋งตอนโดน หดเล็กลงทีละครั้ง แล้วแตกเป็นหยด ขวดมีน้ำยา 10 หน่วย หมดแล้วเติมเอง',
make(){const S=stage(0xBFE0D0,[0,0,13],[0,0,0]);const wet=new Layer(256,128);const wallTex=new THREE.CanvasTexture(cnv(512,256,(g,w,h)=>{g.fillStyle='#BFE0D0';g.fillRect(0,0,w,h);g.fillStyle='#E3B57A';g.fillRect(0,h*.78,w,h*.22);for(let i=0;i<300;i++){g.fillStyle=`rgba(255,255,255,${rnd(.05,.15)})`;g.fillRect(Math.random()*w,Math.random()*h*.78,2,2);}}));
  const mat=surface(wallTex,null,wet,{foam:0});mat.uniforms.uCam.value=S.camera.position;const wall=new THREE.Mesh(new THREE.PlaneGeometry(14,7),mat);S.scene.add(wall);
  const bottle=new THREE.Group();const bb=M(new THREE.CylinderGeometry(.5,.55,1.4,24),0xEF8AC0);bottle.add(bb);const nz=M(new THREE.BoxGeometry(.5,.35,.4),0x9B7EDE);nz.position.set(-.2,.88,0);bottle.add(nz);bottle.position.set(5.6,-2.4,1);bottle.rotation.z=.35;S.scene.add(bottle);

  return {S,reset,down(){if(refill>0)return;const p=onPlaneZ(S.camera,.3);if(!p)return;ammo--;if(ammo<=0)refill=1.5;
      const from=new V3(5.2,-1.6,1);for(let i=0;i<22;i++){const d=p.clone().sub(from);d.x+=rnd(-.5,.5);d.y+=rnd(-.5,.5);S.parts.add(from.clone(),d.multiplyScalar(rnd(2.6,3.4)),{c:0xE8F6FF,s:rnd(.04,.09),life:.36,g:0});}

/* T04 cart */
B.T04={name:'จัดรถเข็นตามสูตร',hint:'ลากของลงรถเข็น',how:'<b>ของ</b> ที่ปล่อยเหนือรถเข็นตกลงซ้อนกันแบบมีน้ำหนัก ยุบตอนกระทบแล้วเด้งคืน <b>รถเข็น</b> โยกตามน้ำหนักที่ตกลงมา ปล่อยที่อื่นของจะลอยกลับชั้นวาง',
make(){const S=stage(0xEAD9B0,[0,6.5,10],[0,1,0]);const floor=new THREE.Mesh(new THREE.PlaneGeometry(16,9),toon(0xF4E6C3,{p:{map:tileTex()}}));floor.rotation.x=-Math.PI/2;S.scene.add(floor);
  const cart=new THREE.Group();const tray=M(new THREE.BoxGeometry(2.6,.25,1.6),0x9AA3B8);tray.position.y=.7;cart.add(tray);[[-1.1,-.6],[1.1,-.6],[-1.1,.6],[1.1,.6]].forEach(p=>{const w=M(new THREE.CylinderGeometry(.22,.22,.15,16),0x2B2D42);w.rotation.x=Math.PI/2;w.position.set(p[0],.22,p[1]);cart.add(w);});
  const pole=M(new THREE.CylinderGeometry(.06,.06,2.2,8),0x9AA3B8);pole.position.set(1.25,1.8,0);cart.add(pole);cart.position.set(1.5,0,0);S.scene.add(cart);

  const kinds=[[0xF4A340,'box'],[0x4EA8DE,'bottle'],[0xEF476F,'box'],[0x9B7EDE,'bottle']];let items=[],stack=[],drag=null,wob=new Spring(120,6,0);
  function mk(i){const k=kinds[i%4];const geo=k[1]==='box'?rounded(.9,.45,.9,4,.08):new THREE.CylinderGeometry(.32,.32,.6,16);const m=M(geo,toon(k[0],{unique:true}),.06);m.userData={home:new V3(-5+(i%4)*.7,1.6,0),sq:new Spring(200,10,1),vy:0,state:'home',h:k[1]==='box'?.45:.6};m.position.copy(m.userData.home);S.scene.add(m);return m;}
  function reset(){items.forEach(m=>S.scene.remove(m));items=[];stack=[];for(let i=0;i<4;i++)items.push(mk(i));}
  reset();
  return {S,reset,down(){const h=items.map(m=>({m,d:hitObj(S.camera,m)})).find(x=>x.d);if(h&&h.m.userData.state==='home'){drag=h.m;drag.userData.state='drag';}},
    move(){if(!drag)return;const p=onPlaneZ(S.camera,0);if(p){drag.position.lerp(new V3(p.x,Math.max(1.5,p.y),0),.5);}},
    up(){if(!drag)return;const m=drag;drag=null;if(Math.abs(m.position.x-cart.position.x)<1.4&&stack.length<5){m.userData.state='fall';m.userData.vy=0;}else m.userData.state='back';},
    update(dt){const top=.85+stack.reduce((a,m)=>a+m.userData.h,0);

    progress(){return {p:stack.length/4,t:`ชั้น ${stack.length}/4`};}};}};

make(){const S=stage(0xF4E6C3,[0,6,10.5],[0,.8,0]);const floor=new THREE.Mesh(new THREE.PlaneGeometry(16,9),toon(0xF4E6C3,{p:{map:tileTex()}}));floor.rotation.x=-Math.PI/2;S.scene.add(floor);
  const bins=[[0x3695F2,'paper'],[0xF6C431,'bottle'],[0x178A4F,'food'],[0x9AA3B8,'misc']].map((b,i)=>{const g=new THREE.Group();const body=M(new THREE.CylinderGeometry(.8,.65,1.6,24),b[0]);body.position.y=.8;g.add(body);const lid=new THREE.Group();lid.position.set(0,1.62,-.8);const lm=M(new THREE.CylinderGeometry(.85,.85,.14,24),b[0]);lm.position.z=.8;lid.add(lm);g.add(lid);g.position.set(-4.2+i*2.8,0,-.5);g.userData={kind:b[1],lid:new Spring(140,7,0),shake:new Spring(200,6,0)};S.scene.add(g);return g;});
  const shapes={paper:()=>new THREE.IcosahedronGeometry(.32,0),bottle:()=>new THREE.CylinderGeometry(.18,.22,.7,12),food:()=>new THREE.TorusGeometry(.25,.1,8,16,Math.PI),misc:()=>new THREE.BoxGeometry(.4,.3,.3)};
  const cols={paper:0xEDEDED,bottle:0x9ED9F5,food:0xF2C14E,misc:0xB0A090};const order=['bottle','paper','food','misc','paper','bottle','misc','food'];

          if(k>=1){if(u.state==='in'){done++;spawn();}else{u.bin.userData.shake.kick(12);u.from=item.position.clone();u.t=0;u.state='back';}}}

/* T06 cloth */
B.T06={name:'บิดผ้าถู',hint:'กดค้างแล้วหมุนเป็นวง',how:'<b>การบิด</b> ทำใน vertex shader ปลายบนยึด ปลายล่างหมุนตามนิ้ว ผ้าเป็นเกลียวและคอดลง ปล่อยนิ้วแล้วคลายกลับนิดหนึ่ง <b>น้ำ</b> หยดถี่ตามความเร็วที่บิด ตกถังเป็นวงกระเพื่อม ผ้าสีจางจากเปียกเป็นหมาด',
make(){const S=stage(0xDDE6EE,[0,1.6,12.5],[0,-.55,0]);const H=3.6,RAD=.85;
  const tex=new THREE.CanvasTexture(cnv(256,512,(g,w,h)=>{g.fillStyle='#B79BE8';g.fillRect(0,0,w,h);g.fillStyle='#9E7FDA';for(let y=40;y<h;y+=140)g.fillRect(0,y,w,22);for(let i=0;i<5000;i++){g.fillStyle=`rgba(255,255,255,${rnd(.04,.14)})`;g.fillRect(Math.random()*w,Math.random()*h,1,rnd(2,5));}}));
  const U={uTwist:{value:0},uSqueeze:{value:0},uH:{value:H}};
  function tw(mat,out){mat.onBeforeCompile=s=>{s.uniforms.uTwist=U.uTwist;s.uniforms.uSqueeze=U.uSqueeze;s.uniforms.uH=U.uH;s.uniforms.uOut={value:out};

    .replace('#include <begin_vertex>',`vec3 transformed=position;float t=clamp((uH*.5-position.y)/uH,0.,1.);float th=atan(position.z,position.x);float r0=length(position.xz);
      float pinch=1.-uSqueeze*.42*sin(3.14159*mix(.15,1.,t));float ridge=1.+uSqueeze*.16*sin(th*6.+t*2.)*smoothstep(0.,.2,t)*smoothstep(1.,.85,t);
      float rr=r0*pinch*ridge+uOut;float th2=th+uTwist*t;transformed.x=cos(th2)*rr;transformed.z=sin(th2)*rr;transformed.y=position.y+uSqueeze*.25*t;`);};mat.customProgramCacheKey=()=>'tw'+out;return mat;}
  const geo=new THREE.CylinderGeometry(RAD,RAD,H,64,90,true);const cm=tw(new THREE.MeshToonMaterial({color:0x8A6BD1,map:tex,gradientMap:RAMP,side:THREE.DoubleSide}),0);
  const cloth=new THREE.Mesh(geo,cm);S.scene.add(cloth);cloth.add(new THREE.Mesh(geo,tw(new THREE.MeshBasicMaterial({color:OUT,side:THREE.BackSide}),.05)));
  const rod=M(new THREE.CylinderGeometry(.16,.16,3.2,24),0xB7793A,.08);rod.rotation.z=Math.PI/2;rod.position.y=H/2+.12;S.scene.add(rod);
  const handle=M(new THREE.TorusGeometry(.7,.13,12,40),0xF6C431,.06);handle.rotation.x=Math.PI/2;S.scene.add(handle);

make(){const S=stage(0x3C3550,[0,3.4,11],[0,.2,0]);const floor=M(new THREE.PlaneGeometry(16,9),0x4A4262,0);floor.rotation.x=-Math.PI/2;S.scene.add(floor);

make(){const S=stage(0xEAD9B0,[0,9,7],[0,0,.5]);const marks=new Layer(512,256);const mat=surface(tileTex(),marks,null,{sheen:0,dirtA:1});const floor=new THREE.Mesh(new THREE.PlaneGeometry(14,7.7),mat);floor.rotation.x=-Math.PI/2;S.scene.add(floor);

  let chairs=[],drag=null;

make(){const S=stage(0xDCE3EE,[0,0,12],[0,0,0]);const panel=M(rounded(10,5.6,1,4,.4),0xF7F9FC,.02);panel.position.z=-.6;S.scene.add(panel);

const el=id=>document.getElementById(id);
function select(k,push){if(!B[k])k='T02';if(!built[k])built[k]=B[k].make();cur=built[k];curK=k;Object.entries(chips).forEach(([kk,b])=>b.setAttribute('aria-pressed',kk===k?'true':'false'));
  el('sid').textContent=k;el('sname').textContent=B[k].name;el('hint').textContent=B[k].hint;el('how').innerHTML='<p>'+B[k].how+'</p>';
  if(push){try{history.replaceState(null,'','#'+k.toLowerCase());}catch(e){location.hash=k.toLowerCase();}}}
const setN=e=>{const b=cv.getBoundingClientRect();ndc.set((e.clientX-b.left)/b.width*2-1,-(e.clientY-b.top)/b.height*2+1);};
cv.addEventListener('pointerdown',e=>{setN(e);cv.setPointerCapture(e.pointerId);cur&&cur.down();});
cv.addEventListener('pointermove',e=>{setN(e);cur&&cur.move();});
const up=()=>cur&&cur.up();cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
el('reset').addEventListener('click',()=>{cur&&cur.reset();cur&&cur.S.parts.clear();});
addEventListener('hashchange',()=>select(location.hash.slice(1).toUpperCase(),false));
select((location.hash.slice(1)||'t02').toUpperCase(),false);
let last=performance.now(),mt=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(cur){const cam=cur.S.camera;const w=cv.clientWidth,h=cv.clientHeight;if(w&&h&&Math.abs(cam.aspect-w/h)>.001){cam.aspect=w/h;cam.updateProjectionMatrix();}
    cur.update(dt,now/1000);mt+=dt;if(mt>.25){mt=0;const p=cur.progress();el('meter').style.width=Math.round(clamp(p.p,0,1)*100)+'%';el('status').textContent=p.t;}R.render(cur.S.scene,cam);}requestAnimationFrame(frame);}
requestAnimationFrame(frame);
window.__bob={select:k=>select(k,false),cur:()=>cur,px:(x,y,z)=>{const v=new THREE.Vector3(x,y,z).project(cur.S.camera);const b=cv.getBoundingClientRect();return [b.left+(v.x+1)/2*b.width,b.top+(1-v.y)/2*b.height];}};
})();
</script>
