<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: a game board. Scene (walkable room) on the left, the cart workbench on the right; stacks to one column on phones. */

  --body:"IBM Plex Sans Thai","Mitr",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1D1F2E; --surface:#272A3D; --ink:#F4EFDD; --muted:#A9ACC4; --line:#3B3F58;
  --sun:#E9B949; --teal:#35BDB6; --rose:#F2668A; --floor:#34374F; --floor2:#2D3046;
  --tool:#E79A3C; --chem:#5BB0E2; --energy:#F2668A; --method:#A892E6;
  --good:#5BD39A; --bad:#FF8A7E; --shade:rgba(0,0,0,.25); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#1D1F2E; --surface:#272A3D; --ink:#F4EFDD; --muted:#A9ACC4; --line:#3B3F58;
  --sun:#E9B949; --teal:#35BDB6; --rose:#F2668A; --floor:#34374F; --floor2:#2D3046;
  --tool:#E79A3C; --chem:#5BB0E2; --energy:#F2668A; --method:#A892E6;
  --good:#5BD39A; --bad:#FF8A7E; --shade:rgba(0,0,0,.25); color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}

.hud{display:flex;flex-wrap:wrap;gap:6px}
.hud span{font-family:var(--display);font-variant-numeric:tabular-nums;background:var(--surface);border:2px solid var(--ink);
  border-radius:999px;padding:2px 12px;font-size:14px}
.hud .warn{background:var(--rose);color:var(--surface)}

@media (max-width:820px){.stage{grid-template-columns:minmax(0,1fr)}}
.scene{position:relative;min-width:0}
canvas{display:block;width:100%;aspect-ratio:8/5;max-width:100%;border:3px solid var(--ink);border-radius:14px;background:var(--floor);touch-action:none}

.chip{display:flex;align-items:center;gap:8px;min-height:34px;border:2px solid var(--ink);border-radius:8px;padding:2px 8px;background:var(--surface);

.chip:focus-visible,.btn:focus-visible,.pick:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.chip .dot{flex:none;width:14px;height:14px;border-radius:4px;border:1.5px solid var(--ink)}
.chip{flex-wrap:wrap}
.chip .nm{flex:1;min-width:0}
.chip .st{order:3;flex-basis:100%;padding-left:22px;margin-top:-4px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}

.fx.g{color:var(--good)} .fx.b{color:var(--bad)} .fx.x{color:var(--muted);text-decoration:line-through}
.row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}

.cover{position:absolute;inset:0;border-radius:14px;background:color-mix(in srgb,var(--bg) 90%,transparent);border:3px solid var(--ink);
  display:flex;flex-direction:column;gap:10px;padding:14px 16px;overflow:auto}
.cover h1{font-family:var(--display);font-weight:600;font-size:22px;margin:0;text-wrap:balance}

.picks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pick{text-align:left;border:2px solid var(--ink);border-radius:10px;background:var(--surface);color:var(--ink);padding:6px 10px;cursor:pointer;font-family:var(--body);font-size:13.5px}
.pick b{font-family:var(--display);font-weight:500;font-size:15px;display:block}
.pick[aria-pressed="true"]{background:var(--sun);color:#2B2D42}
table.cmp{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
table.cmp th,table.cmp td{border-bottom:1px solid var(--line);padding:3px 6px;text-align:right}
table.cmp th:first-child,table.cmp td:first-child{text-align:left}
table.cmp tr.tot td{font-family:var(--display);font-size:16px;border-bottom:none}
.scroll{overflow-x:auto}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%);padding:4px 10px;border:2px solid var(--ink);border-radius:8px;background:var(--sun);color:#2B2D42;font-size:13px}
.toast{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:4px 12px;border-radius:999px;font-size:13px;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
@media (prefers-reduced-motion:no-preference){.bob{transition:transform .2s}.bob:hover{transform:rotate(2deg)}}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><span class="bob">BOB</span><span class="sub">สมรภูมิปัดกวาด · prototype v0.1</span></div>
    <div class="hud" id="hud"></div>
  </header>
  <main class="stage">
    <section class="scene">
      <canvas id="cv" width="800" height="500" aria-label="ฉากห้องเช่า แตะเพื่อเดิน"></canvas>

    </section>
    <aside class="panel" id="panel"></aside>

</div>

<script>
'use strict';
/* ============ DATA (all numbers are untested starting values from the GDD) ============ */
const STATS=['clean','gentle','speed','shine'];
const STAT_TH={clean:'ขจัดคราบ',gentle:'ถนอมพื้นผิว',speed:'เร็ว',shine:'ความเงา'};
const FAM_TH={tool:'อุปกรณ์',chem:'น้ำยา',energy:'แรงทำงาน',method:'วิธีใช้'};
// s = [clean, gentle, speed, shine]; c = cost
const PARTS={
  cloth:{n:'ผ้า',f:'tool',c:10,s:[1,3,1,2]}, sponge:{n:'ฟองน้ำ',f:'tool',c:15,s:[2,2,1,1]},
  brush:{n:'แปรง',f:'tool',c:20,s:[4,0,1,0]}, broom:{n:'ไม้กวาด',f:'tool',c:10,s:[1,2,3,0]},
  soap:{n:'สบู่',f:'chem',c:15,s:[2,1,0,1]}, vinegar:{n:'น้ำส้มสายชู',f:'chem',c:20,s:[3,0,0,1]},
  soda:{n:'เบกกิ้งโซดา',f:'chem',c:15,s:[2,1,0,0]}, polish:{n:'น้ำมันขัดเงา',f:'chem',c:25,s:[0,1,0,4]},
  hot:{n:'น้ำร้อน',f:'energy',c:20,s:[2,0,1,0]}, steam:{n:'ไอน้ำ',f:'energy',c:30,s:[3,1,0,1]},
  scrub:{n:'แรงขัด',f:'energy',c:15,s:[3,-1,1,0]}, air:{n:'ลมเป่า',f:'energy',c:10,s:[0,1,2,1]},
  soak:{n:'แช่ไว้',f:'method',c:5,s:[2,0,-2,0]}, spray:{n:'ฉีดพ่น',f:'method',c:5,s:[-1,0,2,0]}, circle:{n:'ถูวน',f:'method',c:5,s:[0,0,0,2]}
};
const METHODS=['soak','spray','circle'];
const MAX_LAYERS=5, MAX_METHODS=2, ROUND_TIME=100, ROUND_BUDGET=100, HAND=3;
// Order-sensitive reactions between consecutive parts (methods are skipped). lo sits below hi.
const RULES=[
  {lo:['hot'],hi:['soap'],d:[3,0,0,0],t:'น้ำร้อนละลายสบู่ ขจัดคราบดีขึ้น'},
  {lo:['soap'],hi:['hot'],d:[0,0,-2,0],t:'ฟองล้น เสียเวลา'},
  {lo:['vinegar'],hi:['soda'],sym:true,d:[2,-1,0,0],t:'ฟู่! กัดคราบแรงขึ้นแต่กัดพื้นผิวด้วย'},
  {lo:['sponge'],hi:['soap'],d:[1,1,0,0],t:'ฟองน้ำอุ้มสบู่ นุ่มและสะอาด'},
  {lo:['brush'],hi:['scrub'],d:[3,-2,0,0],t:'ขัดด้วยแปรงเต็มแรง สะอาดแต่เป็นรอย'},
  {lo:['cloth'],hi:['polish'],d:[0,0,0,3],t:'ผ้ารองน้ำมันขัดเงา เงาวับ'},
  {lo:['polish'],hi:['soap','vinegar','soda'],d:[0,0,0,-2],t:'น้ำยาล้างความเงาออก'},
  {lo:['steam'],hi:['cloth'],d:[0,1,0,2],t:'ไอน้ำแล้วเช็ดผ้า เงาและถนอม'},
  {lo:['broom'],hi:['hot','steam'],d:[-2,0,0,0],t:'ฝุ่นเปียกกลายเป็นโคลน'},
  {lo:['hot','steam'],hi:['air'],d:[0,0,1,1],t:'เป่าแห้งหลังเปียก'}
];
// A method reacts with the part directly below it.
const MRULES=[
  {m:'soak',below:['vinegar'],d:[2,0,0,0],t:'แช่น้ำส้มสายชู คราบหลุดง่าย'},
  {m:'spray',below:['soap'],d:[0,0,1,0],t:'ฉีดพ่นสบู่ ทั่วถึงเร็ว'},
  {m:'circle',below:['polish'],d:[0,0,0,2],t:'ถูวนน้ำมันขัดเงา เงาขึ้นอีก'},
  {m:'circle',below:['cloth'],d:[0,0,0,1],t:'ถูวนด้วยผ้า'}
];
const ENEMIES={
  stain:{n:'Stain',th:'คราบทั่วไป',col:'#7A5C3E',need:{clean:6},tip:'แพ้น้ำยาทุกชนิด'},
  dust:{n:'Dust',th:'ฝุ่น',col:'#A9A39A',need:{clean:5,speed:3},tip:'แพ้ของแห้ง (ผ้า ไม้กวาด ลมเป่า) โดนน้ำแล้วเป็นโคลน'},
  grease:{n:'Grease',th:'คราบมัน',col:'#C9A227',need:{clean:7},tip:'แพ้ความร้อน (น้ำร้อน ไอน้ำ) ไม่มีความร้อนแทบไม่ออก'},
  rust:{n:'Rust',th:'สนิม',col:'#B5532A',need:{clean:7,gentle:1},tip:'แพ้น้ำส้มสายชูคู่กับแรงขัดหรือแปรง โดนน้ำหรือแช่ไว้จะลาม'},
  scale:{n:'Scale',th:'คราบหินปูน',col:'#8FB8CC',need:{clean:6,gentle:3},tip:'แพ้น้ำส้มสายชูที่แช่ไว้ ขัดแรงแล้วพื้นผิวเป็นรอย'}
};
const CHARS={
  sweep:{n:'Sweep',col:'#F4A340',ab:'จัดทัพ',d:'สลับที่ 2 ชั้นที่ติดกันโดยไม่ต้องยกออก'},
  bubble:{n:'Bubble',col:'#4EA8DE',ab:'โล่ฟอง',d:'ยกเลิกปฏิกิริยาหักล้างที่แรงที่สุด 1 คู่ในรอบนี้'},
  spray:{n:'Spray',col:'#9B7EDE',ab:'เล็งเป้า',d:'ดูคะแนนที่กองปัจจุบันจะได้ 1 ครั้ง'},
  press:{n:'Press',col:'#57CC99',ab:'รีดเวลา',d:'หยุดนาฬิกา 8 วินาที'}
};
const EXTRAS=[{k:'gentle',v:3,t:'พื้นผิวบอบบาง'},{k:'shine',v:4,t:'ลูกค้าอยากได้เงาวับ'},{k:'speed',v:3,t:'ลูกค้ารีบ'}];

/* ============ PURE GAME LOGIC ============ */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const sum4=d=>d[0]+d[1]+d[2]+d[3];
const isMethod=id=>PARTS[id].f==='method';
function stackCost(stack){return stack.reduce((a,id)=>a+PARTS[id].c,0)}
function countLayers(stack){return stack.filter(id=>!isMethod(id)).length}
function countMethods(stack){return stack.filter(isMethod).length}

function evalStack(stack,enemies=[],shield=false){
  const tot=[0,0,0,0], fx=[];
  stack.forEach(id=>PARTS[id].s.forEach((v,i)=>tot[i]+=v));
  const P=stack.map((id,i)=>({id,i})).filter(o=>!isMethod(o.id));
  for(let k=0;k<P.length-1;k++){
    const lo=P[k],hi=P[k+1];
    RULES.forEach(r=>{
      const hit=(r.lo.includes(lo.id)&&r.hi.includes(hi.id))||(r.sym&&r.lo.includes(hi.id)&&r.hi.includes(lo.id));
      if(hit) fx.push({d:r.d,t:r.t,at:hi.i,src:'pair'});
    });
  }
  for(let i=1;i<stack.length;i++) if(isMethod(stack[i]))
    MRULES.forEach(r=>{ if(r.m===stack[i]&&r.below.includes(stack[i-1])) fx.push({d:r.d,t:r.t,at:i,src:'method'}) });
  if(P.length&&P[P.length-1].id==='air') fx.push({d:[0,0,2,0],t:'จบด้วยลมเป่า แห้งไว',at:P[P.length-1].i,src:'top'});
  const has=id=>stack.includes(id), cnt=ids=>stack.filter(id=>ids.includes(id)).length;
  enemies.forEach(e=>{
    if(e==='dust'){
      const dry=cnt(['cloth','broom','air']), wet=cnt(['hot','steam']);
      if(dry) fx.push({d:[dry,0,0,0],t:'Dust แพ้ของแห้ง',at:-1,src:'enemy'});
      if(wet) fx.push({d:[-2*wet,0,0,0],t:'Dust โดนน้ำกลายเป็นโคลน',at:-1,src:'enemy'});
    }
    if(e==='grease'){
      if(has('hot')||has('steam')) fx.push({d:[2,0,0,0],t:'Grease แพ้ความร้อน',at:-1,src:'enemy'});
      else if(stack.length) fx.push({d:[-3,0,0,0],t:'Grease ไม่ออกเพราะไม่มีความร้อน',at:-1,src:'enemy'});
    }
    if(e==='rust'){
      if(has('vinegar')&&(has('scrub')||has('brush'))) fx.push({d:[3,0,0,0],t:'Rust แพ้น้ำส้มสายชูกับแรงขัด',at:-1,src:'enemy'});
      if(has('hot')||has('steam')||has('soak')) fx.push({d:[-2,0,0,0],t:'Rust ลามเพราะโดนน้ำหรือแช่ไว้',at:-1,src:'enemy'});
    }
    if(e==='scale'){
      if(has('vinegar')&&has('soak')) fx.push({d:[3,0,0,0],t:'Scale แพ้น้ำส้มสายชูที่แช่ไว้',at:-1,src:'enemy'});
      if(has('scrub')||has('brush')) fx.push({d:[0,-2,0,0],t:'ขัดแรงบนคราบหินปูน พื้นผิวเป็นรอย',at:-1,src:'enemy'});
    }
  });
  fx.forEach(f=>{f.good=sum4(f.d)>=0;f.off=false});
  if(shield){
    let worst=null;
    fx.forEach(f=>{ if(sum4(f.d)<0&&(!worst||sum4(f.d)<sum4(worst.d))) worst=f });
    if(worst) worst.off=true;
  }
  fx.forEach(f=>{ if(!f.off) f.d.forEach((v,i)=>tot[i]+=v) });
  const stats={}; STATS.forEach((k,i)=>stats[k]=tot[i]);
  return {stats,fx,cost:stackCost(stack),layers:countLayers(stack)};
}
function buildSpec(enemies,round,rng){
  const need={}, notes=[];
  enemies.forEach(e=>Object.entries(ENEMIES[e].need).forEach(([k,v])=>need[k]=Math.max(need[k]||0,v)));
  const pool=EXTRAS.filter(x=>!(need[x.k]>=x.v));
  for(let i=0;i<round-1&&pool.length;i++){
    const x=pool.splice(Math.floor(rng()*pool.length),1)[0];
    need[x.k]=Math.max(need[x.k]||0,x.v); notes.push(x.t);
  }
  return {need,notes};
}
function testScore(stats,spec){
  const ks=Object.keys(spec.need); let acc=0, pass=true;
  ks.forEach(k=>{const r=Math.max(0,Math.min(1,stats[k]/spec.need[k])); acc+=r; if(stats[k]<spec.need[k]) pass=false});
  const base=ks.length?acc/ks.length*100:0;
  return {pass,score:pass?base:base*0.5};
}
function totalScore(stats,spec,budgetLeft,budget,timeFrac){
  const t=testScore(stats,spec);
  const b=Math.max(0,budgetLeft)/budget*100, tm=Math.max(0,Math.min(1,timeFrac))*100;
  return {pass:t.pass,test:t.score,budget:b,time:tm,total:Math.round(0.7*t.score+0.2*b+0.1*tm)};
}
function randomStack(offer,budget,rng){
  const n=2+Math.floor(rng()*4), st=[]; let m=0;
  for(let i=0;i<n;i++){
    const id=offer[Math.floor(rng()*offer.length)];
    if(stackCost(st)+PARTS[id].c>budget) break;
    st.push(id);
    if(m<MAX_METHODS&&rng()<0.3){const mm=METHODS[Math.floor(rng()*3)]; if(stackCost(st)+5<=budget){st.push(mm);m++}}
  }
  return st;
}
function aiBest(offer,spec,enemies,budget,tries,rng,timeFrac){
  let best=null;
  for(let i=0;i<tries;i++){
    const st=randomStack(offer,budget,rng); if(!countLayers(st)) continue;
    const ev=evalStack(st,enemies,false);
    const sc=totalScore(ev.stats,spec,budget-ev.cost,budget,timeFrac);
    if(!best||sc.total>best.sc.total) best={stack:st,ev,sc};
  }
  return best;
}
function makeRound(round,seed){
  const rng=mulberry(seed+round*7919), ids=Object.keys(ENEMIES);
  const pick=()=>ids[Math.floor(rng()*ids.length)];
  for(let attempt=0;attempt<40;attempt++){
    let enemies=[round===1?['stain','dust','grease'][Math.floor(rng()*3)]:pick()];
    if(round===3){let e2=pick(); while(e2===enemies[0]) e2=pick(); enemies.push(e2)}
    const spec=buildSpec(enemies,round,rng);
    const fam=f=>{const a=Object.keys(PARTS).filter(k=>PARTS[k].f===f);for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}; // Fisher-Yates: same result on every JS engine
    const offer=[...fam('tool').slice(0,3),...fam('chem').slice(0,3),...fam('energy').slice(0,2)];
    const chk=aiBest(offer,spec,enemies,ROUND_BUDGET,500,rng,0.3);
    if(chk&&chk.sc.pass) return {round,enemies,spec,offer};
  }
  return {round,enemies:['stain'],spec:{need:{clean:6},notes:[]},offer:['cloth','sponge','brush','soap','vinegar','soda','hot','scrub']};
}

/* ============ TELEMETRY (opt-in: open with ?server=http://127.0.0.1:7350) ============ */
// Sends play events to the Nakama analytics backend. Without ?server= it does nothing and the game stays fully offline.
const TEL={url:null,key:'defaultkey',token:null,match:null,ready:null};
try{const q=new URLSearchParams(location.search);TEL.url=q.get('server');if(q.get('key'))TEL.key=q.get('key')}catch(e){}
function telAuth(){
  if(!TEL.url) return Promise.resolve(null);
  if(TEL.ready) return TEL.ready;
  let dev='';try{dev=localStorage.getItem('bob.device')||''}catch(e){}
  if(!dev){dev='proto-'+Math.random().toString(36).slice(2)+Date.now().toString(36);try{localStorage.setItem('bob.device',dev)}catch(e){}}
  TEL.ready=fetch(TEL.url+'/v2/account/authenticate/device?create=true',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Basic '+btoa(TEL.key+':')},body:JSON.stringify({id:dev})})
    .then(r=>r.json()).then(j=>TEL.token=j.token||null).catch(e=>{console.warn('telemetry off:',e);return null});
  return TEL.ready;
}
function telRpc(id,body){
  return telAuth().then(t=>t&&fetch(TEL.url+'/v2/rpc/'+id+'?unwrap',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify(body)}))
    .catch(e=>console.warn('telemetry',id,e));
}
function tel(event,data){ if(TEL.url) telRpc('bob_log_event',{event,match:TEL.match,data:Object.assign({char:S.char},data)}) }

function startMatch(){TEL.match='m'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);S.round=0;S.wins=0;S.losses=0;S.carry=0;S.rivalCarry=0;S.seed=(Date.now()%1e6)|0;tel('match_start',{seed:S.seed});nextRound()}
function nextRound(){
  S.round++; S.R=makeRound(S.round,S.seed); S.stack=[]; S.hand=[]; S.time=ROUND_TIME; S.budget=ROUND_BUDGET+Math.floor(S.carry/2);
  S.abUsed=false;S.shield=false;S.swap=false;S.freeze=0;S.preview=null;S.p={x:400,y:440,tx:null,ty:null,stuck:0};
  S.phase='intro'; render();
}
function beginBuild(){S.phase='build';render()}
function ev(){return evalStack(S.stack,S.R.enemies,S.shield)}
function budgetLeft(){return S.budget-stackCost(S.stack)}
function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,1800)}
function pickUp(id){
  if(S.phase!=='build') return;
  if(S.hand.length>=HAND) return toast('มือเต็มแล้ว ถือได้ '+HAND+' ชิ้น');
  S.hand.push(id); render();
}
function place(i){
  if(S.phase!=='build') return false;
  const id=S.hand[i]; if(!id) return false;
  if(!S.nearCart){toast('เดินไปที่รถเข็นก่อน');return false}
  if(isMethod(id)){
    if(countMethods(S.stack)>=MAX_METHODS){toast('ใช้วิธีใช้ได้ '+MAX_METHODS+' อย่างต่อกอง');return false}
    if(!S.stack.length||isMethod(S.stack[S.stack.length-1])){toast('วิธีใช้ต้องวางบนอุปกรณ์ น้ำยา หรือแรงทำงาน');return false}
  }else if(countLayers(S.stack)>=MAX_LAYERS){toast('รถเข็นเต็ม 5 ชั้นแล้ว');return false}
  if(PARTS[id].c>budgetLeft()){toast('งบไม่พอ');return false}
  S.stack.push(id); S.hand.splice(i,1); S.preview=null; render(); return true;
}
function liftTop(){
  if(S.phase!=='build'||!S.stack.length) return;
  if(!S.nearCart) return toast('เดินไปที่รถเข็นก่อน');
  const id=S.stack.pop(); if(S.hand.length<HAND) S.hand.push(id); else toast('มือเต็ม ชิ้นนี้ถูกวางคืนชั้น');
  S.preview=null; render();
}
function swapAt(i){ // swap item i with the one above it
  if(i<0||i>=S.stack.length-1) return;
  const a=S.stack.slice(); [a[i],a[i+1]]=[a[i+1],a[i]];
  if(isMethod(a[0])||a.some((id,k)=>isMethod(id)&&k>0&&isMethod(a[k-1]))) return toast('สลับแล้ววิธีใช้ไม่มีชิ้นส่วนรองรับ');
  S.stack=a; S.swap=false; if(!S.abUsed)tel('ability_used',{round:S.round,ability:CHARS[S.char].ab}); S.abUsed=true; S.preview=null; toast('จัดทัพ! สลับชั้นแล้ว'); render();
}
function useAbility(){
  if(S.phase!=='build'||S.abUsed) return;
  const c=S.char;
  const was=S.abUsed; setTimeout(()=>{if(!was&&S.abUsed)tel('ability_used',{round:S.round,ability:CHARS[c].ab})},0);
  if(c==='sweep'){ if(S.stack.length<2) return toast('ต้องมีอย่างน้อย 2 ชิ้นบนรถเข็น'); S.swap=!S.swap; render(); return }
  if(c==='bubble'){S.shield=true;S.abUsed=true;toast('โล่ฟอง! กันปฏิกิริยาหักล้างที่แรงที่สุด')}
  if(c==='spray'){const e=ev();S.preview=totalScore(e.stats,S.R.spec,budgetLeft(),S.budget,S.time/ROUND_TIME);S.abUsed=true;toast('เล็งเป้า! กองนี้จะได้ '+S.preview.total+' คะแนน')}
  if(c==='press'){S.freeze=8;S.abUsed=true;toast('รีดเวลา! หยุดนาฬิกา 8 วินาที')}
  render();
}
function submit(){
  if(S.phase!=='build') return;
  const e=ev(), left=budgetLeft();
  const mine=totalScore(e.stats,S.R.spec,left,S.budget,S.time/ROUND_TIME);
  const rng=mulberry(S.seed*31+S.round), rb=ROUND_BUDGET+Math.floor(S.rivalCarry/2);
  const rv=aiBest(S.R.offer,S.R.spec,S.R.enemies,rb,5+S.round*4,rng,0.1+rng()*0.25);
  let res=mine.total>rv.sc.total?'win':mine.total<rv.sc.total?'lose':(left>=rb-rv.ev.cost?'win':'lose');
  if(res==='win') S.wins++; else S.losses++;
  S.carry=Math.max(0,left); S.rivalCarry=Math.max(0,rb-rv.ev.cost);
  S.last={e,mine,rv,res}; S.phase='test'; render();
  if(TEL.url){ // the server re-scores the stack itself (stack_scored), the client reports the round outcome
    telRpc('bob_score_stack',{seed:S.seed,round:S.round,stack:S.stack,budget:S.budget,timeFrac:S.time/ROUND_TIME,shield:S.shield,match:TEL.match,char:S.char});
    tel('round_result',{round:S.round,seed:S.seed,result:res,stack:S.stack,my_total:mine.total,rival_total:rv.sc.total,pass:mine.pass,rival_pass:rv.sc.pass,rival_stack:rv.stack,cost:e.cost,budget:S.budget,time_left:Math.round(S.time),ability_used:S.abUsed,enemies:S.R.enemies});
  }
}
function afterTest(){
  if(S.wins>=2||S.losses>=2||S.round>=3){ S.gain=S.wins>S.losses?30:20; S.coins+=S.gain; tel('match_end',{wins:S.wins,losses:S.losses,rounds:S.round,coins:S.gain}); S.phase='result'; render() }
  else nextRound();
}

  let t='';
  if(S.phase==='build'){
    if(!S.hand.length&&!S.stack.length) t='แตะในห้องเพื่อเดินไปที่จุดเก็บของ แล้วแตะชิ้นส่วนเพื่อหยิบ';
    else if(S.hand.length&&!S.nearCart) t='ถือของอยู่ เดินไปที่รถเข็นกลางห้องเพื่อวาง';
    else if(S.nearCart&&S.hand.length) t='แตะหรือลากชิ้นส่วนในมือไปที่รถเข็น ลำดับการซ้อนมีผล';
    else t='ดูแถบค่าทางขวา เส้นสีชมพูคือเป้าของสเปก';
  }
  if($('hint').textContent!==t) $('hint').textContent=t;
}

/* ============ INPUT ============ */
document.addEventListener('click',ev2=>{
  const b=ev2.target.closest('button'); if(!b||b.disabled) return;
  const d=b.dataset;
  if(d.char){S.char=d.char;try{localStorage.setItem('bob.char',S.char)}catch(e){} render()}
  else if(d.act==='start'||d.act==='again') startMatch();
  else if(d.act==='title'){S.phase='title';S.R=null;render()}
  else if(d.act==='begin') beginBuild();
  else if(d.act==='after') afterTest();
  else if(d.act==='ability') useAbility();
  else if(d.act==='submit') submit();
  else if(d.pick) pickUp(d.pick);
  else if(d.lift) liftTop();
  else if(d.swap!=null) swapAt(+d.swap);
  else if(d.hand!=null&&!drag.moved) place(+d.hand);
});
// Drag from hand to cart
const drag={i:-1,moved:false,ghost:null,x0:0,y0:0};
document.addEventListener('pointerdown',e=>{
  const b=e.target.closest('[data-hand]'); drag.moved=false; if(!b) return;
  drag.i=+b.dataset.hand; drag.x0=e.clientX; drag.y0=e.clientY;
});
document.addEventListener('pointermove',e=>{
  if(drag.i<0) return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)>8){
    drag.moved=true; drag.ghost=document.createElement('div'); drag.ghost.className='ghost';
    drag.ghost.textContent=PARTS[S.hand[drag.i]]?.n||''; document.body.appendChild(drag.ghost);
  }
  if(drag.ghost){drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px'}
});
document.addEventListener('pointerup',e=>{
  if(drag.i<0) return;
  if(drag.moved){
    const box=$('cartBox'), r=box&&box.getBoundingClientRect();
    if(r&&e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom) place(drag.i);
    else toast('ลากไปปล่อยที่กล่องรถเข็น');
  }
  if(drag.ghost){drag.ghost.remove();drag.ghost=null}
  drag.i=-1; setTimeout(()=>drag.moved=false,0);
});
addEventListener('keydown',e=>{S.keys[e.key.toLowerCase()]=true; if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase())&&S.phase==='build') e.preventDefault()});
addEventListener('keyup',e=>{S.keys[e.key.toLowerCase()]=false});
const cvEl=$('cv'), g=cvEl.getContext('2d');
cvEl.addEventListener('pointerdown',e=>{
  if(S.phase!=='build') return;
  const r=cvEl.getBoundingClientRect();
  S.p.tx=(e.clientX-r.left)/r.width*800; S.p.ty=(e.clientY-r.top)/r.height*500; S.p.stuck=0;
});

/* ============ SCENE: MOVE + DRAW ============ */
function rectDist(px,py,r){const cx=Math.max(r.x,Math.min(px,r.x+r.w)),cy=Math.max(r.y,Math.min(py,r.y+r.h));return {d:Math.hypot(px-cx,py-cy),cx,cy}}
function update(dt){
  if(S.phase!=='build') return;
  if(S.freeze>0) S.freeze=Math.max(0,S.freeze-dt); else S.time-=dt;
  if(S.time<=0){S.time=0; if(countLayers(S.stack)) submit(); else {toast('หมดเวลา! ส่งรถเข็นเปล่า'); submit()} return}
  const p=S.p, k=S.keys; let vx=0,vy=0;
  if(k['w']||k['arrowup']) vy-=1; if(k['s']||k['arrowdown']) vy+=1; if(k['a']||k['arrowleft']) vx-=1; if(k['d']||k['arrowright']) vx+=1;
  if(vx||vy){p.tx=null}
  else if(p.tx!=null){const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy); if(d<5){p.tx=null}else{vx=dx/d;vy=dy/d}}
  const n=Math.hypot(vx,vy);
  if(n){
    const sp=230*dt, ox=p.x, oy=p.y; p.x+=vx/n*sp; p.y+=vy/n*sp;
    p.x=Math.max(18,Math.min(782,p.x)); p.y=Math.max(18,Math.min(482,p.y));
    SOLID.forEach(r=>{const q=rectDist(p.x,p.y,r); if(q.d<16){ if(q.d>0.01){p.x=q.cx+(p.x-q.cx)/q.d*16;p.y=q.cy+(p.y-q.cy)/q.d*16}else{p.x=ox;p.y=oy} }});
    if(p.tx!=null){ if(Math.hypot(p.x-ox,p.y-oy)<sp*0.25){p.stuck+=dt; if(p.stuck>0.4) p.tx=null}else p.stuck=0 }
  }
  let near=null,best=46; ST.forEach(s=>{const q=rectDist(p.x,p.y,s); if(q.d<best){best=q.d;near=s.id}});
  const nc=rectDist(p.x,p.y,CART).d<50;
  if(near!==S.near||nc!==S.nearCart){S.near=near;S.nearCart=nc;render()}
}
let css={},cssT=0;
function col(n){return css[n]}
function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r)}
function label(t,x,y,size,color,align){g.font=`500 ${size}px Mitr, "IBM Plex Sans Thai", sans-serif`;g.fillStyle=color;g.textAlign=align||'center';g.textBaseline='middle';g.fillText(t,x,y)}
function draw(now){
  if(now-cssT>500||!css.ink){const cs=getComputedStyle(document.documentElement);['ink','surface','floor','floor2','sun','teal','rose','tool','chem','energy','method','muted','bg'].forEach(k=>css[k]=cs.getPropertyValue('--'+k).trim());cssT=now}
  g.clearRect(0,0,800,500); g.fillStyle=col('floor'); g.fillRect(0,0,800,500);
  g.fillStyle=col('floor2'); for(let y=0;y<500;y+=50) for(let x=(y/50%2)*50;x<800;x+=100) g.fillRect(x,y,50,50);
  g.lineWidth=3; g.strokeStyle=col('ink');
  ST.forEach(s=>{rr(s.x,s.y,s.w,s.h,10);g.fillStyle=col(s.id);g.fill();g.stroke();
    if(S.near===s.id){g.lineWidth=5;g.strokeStyle=col('sun');rr(s.x-5,s.y-5,s.w+10,s.h+10,14);g.stroke();g.lineWidth=3;g.strokeStyle=col('ink')}
    label(s.n,s.x+s.w/2,s.y+s.h/2,17,'#2B2D42')});
  rr(SOFA.x,SOFA.y,SOFA.w,SOFA.h,12);g.fillStyle=col('surface');g.fill();g.stroke();label('โซฟา',SOFA.x+SOFA.w/2,SOFA.y+SOFA.h/2,14,col('muted'));
  // enemies
  (S.R?S.R.enemies:['stain']).forEach((e,i,arr)=>{const ex=400+(i-(arr.length-1)/2)*120,ey=96,E=ENEMIES[e],wob=Math.sin(now/300+i)*3;
    g.beginPath();g.ellipse(ex,ey+34,40,8,0,0,7);g.fillStyle='rgba(0,0,0,.15)';g.fill();
    g.beginPath();for(let a=0;a<=12;a++){const an=a/12*6.283,rad=34+Math.sin(an*3+now/400)*5;const X=ex+Math.cos(an)*rad,Y=ey+wob+Math.sin(an)*rad*0.8;a?g.lineTo(X,Y):g.moveTo(X,Y)}g.closePath();
    g.fillStyle=E.col;g.fill();g.stroke();
    [[-11],[11]].forEach(([dx])=>{g.beginPath();g.arc(ex+dx,ey+wob-4,8,0,7);g.fillStyle='#fff';g.fill();g.stroke();g.beginPath();g.arc(ex+dx+2,ey+wob-2,3.5,0,7);g.fillStyle='#2B2D42';g.fill()});
    g.beginPath();g.moveTo(ex-22,ey+wob-16);g.lineTo(ex-4,ey+wob-10);g.moveTo(ex+22,ey+wob-16);g.lineTo(ex+4,ey+wob-10);g.stroke();
    label(E.n,ex,ey+56,15,col('ink'))});
  // cart
  rr(CART.x,CART.y,CART.w,CART.h,8);g.fillStyle=col('surface');g.fill();g.stroke();
  if(S.nearCart){g.lineWidth=5;g.strokeStyle=col('sun');rr(CART.x-5,CART.y-5,CART.w+10,CART.h+10,12);g.stroke();g.lineWidth=3;g.strokeStyle=col('ink')}
  S.stack.filter(id=>!isMethod(id)).forEach((id,i)=>{g.fillStyle=col(PARTS[id].f);g.fillRect(CART.x+8,CART.y+CART.h-12-i*10,CART.w-16,8)});
  g.beginPath();g.arc(CART.x+16,CART.y+CART.h+6,6,0,7);g.arc(CART.x+CART.w-16,CART.y+CART.h+6,6,0,7);g.fillStyle=col('ink');g.fill();
  label('รถเข็น',CART.x+CART.w/2,CART.y-12,14,col('ink'));
  // target marker
  const p=S.p; if(p.tx!=null){g.beginPath();g.arc(p.tx,p.ty,7,0,7);g.strokeStyle=col('rose');g.stroke();g.strokeStyle=col('ink')}
  // player
  const C=CHARS[S.char]; g.beginPath();g.ellipse(p.x,p.y+16,16,5,0,0,7);g.fillStyle='rgba(0,0,0,.18)';g.fill();
  rr(p.x-13,p.y-4,26,22,8);g.fillStyle=C.col;g.fill();g.stroke();
  g.beginPath();g.arc(p.x,p.y-12,13,0,7);g.fillStyle='#F7CFA6';g.fill();g.stroke();
  g.fillStyle='#EF476F';g.fillRect(p.x-13,p.y-19,26,5);
  g.fillStyle='#2B2D42';g.beginPath();g.arc(p.x-5,p.y-11,2,0,7);g.arc(p.x+5,p.y-11,2,0,7);g.fill();
  S.hand.forEach((id,i)=>{g.beginPath();g.arc(p.x-14+i*14,p.y-34,6,0,7);g.fillStyle=col(PARTS[id].f);g.fill();g.stroke()});
}
let last=performance.now(), lastSec=-1;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  update(dt); draw(now); setHint();
  const sec=Math.ceil(S.time);
  if(S.phase==='build'&&sec!==lastSec){lastSec=sec;const t=$('hudTime'); if(t){t.textContent='เวลา '+sec+(S.freeze>0?' (หยุด)':'');t.className=S.time<=15?'warn':''}}
  requestAnimationFrame(frame);
}
render(); requestAnimationFrame(frame);
// Exposed for tests and for the next developer.
window.BOB={S,PARTS,ENEMIES,evalStack,totalScore,testScore,makeRound,aiBest,mulberry,startMatch,beginBuild,pickUp,place,liftTop,submit,afterTest,useAbility,swapAt,render};
</script>
