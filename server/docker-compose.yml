# Local development only. Change every password and key before any real deployment.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=nakama
      - POSTGRES_PASSWORD=localdb
    volumes:
      - bob_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 3s
      timeout: 3s
      retries: 10
  nakama:
    image: heroiclabs/nakama:3.22.0
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address postgres:localdb@postgres:5432/nakama &&
        exec /nakama/nakama --name bob1 --database.address postgres:localdb@postgres:5432/nakama
        --logger.level INFO --session.token_expiry_sec 7200
        --runtime.path /nakama/data/modules --runtime.js_entrypoint index.js
    volumes:
      - ./modules:/nakama/data/modules
    ports:
      - "7349:7349"   # gRPC API
      - "7350:7350"   # HTTP API + realtime socket
      - "7351:7351"   # admin console
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  bob_pg:
